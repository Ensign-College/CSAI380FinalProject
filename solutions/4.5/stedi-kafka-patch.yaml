# Completed version of starter/k8s/kafka/stedi-kafka-patch.yaml (TODO solved).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stedi
spec:
  template:
    spec:
      containers:
        - name: stedi
          env:
            - name: KAFKA_BROKER
              value: "kafka.<your-namespace>.svc.cluster.local:9092"
            - name: ENABLE_SIMULATION_MODE
              value: "true"
            # Solution to TODO(student): matches the topic created in step 3
            - name: KAFKA_STEDI_EVENTS_TOPIC
              value: "customer-risk"
