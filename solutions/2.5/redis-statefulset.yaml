# Completed version of starter/k8s/stateful/redis-statefulset.yaml (TODO solved).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-stedi
  namespace: <your-namespace>
spec:
  serviceName: redis-stedi
  replicas: 1
  selector:
    matchLabels:
      app: redis-stedi
  template:
    metadata:
      labels:
        app: redis-stedi
    spec:
      containers:
        - name: redis
          image: redis:8   # includes RedisJSON, which STEDI uses to store and score balance tests
          command: ["redis-server", "--requirepass", "$(REDIS_PASS)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASS
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
  # Solution to TODO(student)
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
