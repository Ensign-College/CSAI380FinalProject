# Completed version of starter/k8s/stateful/mysql-statefulset.yaml (TODO solved).
# ⚠️ Single-node MySQL is insecure by design for teaching — not production-grade.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: <your-namespace>
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "stedi"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Solution to TODO(student): small dataset, but leaves headroom for
            # binlogs/redo logs; PD storage is cheap per GB.
            storage: 10Gi
