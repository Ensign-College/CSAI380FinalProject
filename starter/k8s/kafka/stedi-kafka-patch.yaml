# Strategic-merge patch for the STEDI deployment — week 4.
# Points STEDI at your in-cluster Kafka and turns on demo mode so the
# simulation can generate live user data.
# Apply with:
#   kubectl patch deployment stedi -n <your-namespace> --patch-file stedi-kafka-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stedi
spec:
  template:
    spec:
      containers:
        - name: stedi
          env:
            # Bitnami chart service DNS: <release>.<namespace>.svc.cluster.local:9092
            - name: KAFKA_BROKER
              value: "kafka.<your-namespace>.svc.cluster.local:9092"
            # TODO(student): add the KAFKA_RISK_TOPIC environment variable and
            # set it to the topic you created in step 2 of assignment 4.5.
