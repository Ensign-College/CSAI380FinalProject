# Redis for STEDI sign-up/log-in state — week 2.
# Single-node Redis: fine for this class, not highly available.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-stedi
  namespace: <your-namespace>
spec:
  serviceName: redis-stedi
  replicas: 1
  selector:
    matchLabels:
      app: redis-stedi
  template:
    metadata:
      labels:
        app: redis-stedi
    spec:
      containers:
        - name: redis
          image: redis:8   # includes RedisJSON, which STEDI uses to store and score balance tests
          command: ["redis-server", "--requirepass", "$(REDIS_PASS)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASS
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
  # TODO(student): add a volumeClaimTemplates section named "redis-data" that
  # requests 1Gi of ReadWriteOnce storage so Redis data survives pod replacement.
