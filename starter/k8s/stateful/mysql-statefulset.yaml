# Single-node MySQL — week 2.
# ⚠️ Insecure by design for teaching: a single-node MySQL is NOT production-grade.
# Production needs high availability and clustering (covered later with Helm).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: <your-namespace>
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "stedi"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # TODO(student): choose an appropriate storage size for the class
            # workload (hint: 10Gi is plenty) and justify it in your README.
            storage: <size>
