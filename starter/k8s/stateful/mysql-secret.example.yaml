# EXAMPLE ONLY — do not commit a filled-in copy of this file.
# Create the real secrets imperatively so they never land in git:
#
#   kubectl create secret generic redis-secrets -n <your-namespace> \
#     --from-literal=REDIS_PASS='<choose-a-password>'
#
#   kubectl create secret generic mysql-secrets -n <your-namespace> \
#     --from-literal=MYSQL_ROOT_PASSWORD='<choose-a-password>'
#
# The manifests in this directory reference these secrets with secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: <your-namespace>
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: <never-commit-a-real-password>
