# Values for the Bitnami Kafka Helm chart (oci://registry-1.docker.io/bitnamicharts/kafka).
# ⚠️ Teaching configuration: single replica, PLAINTEXT listeners, no auth.
# Never run Kafka like this in production.
# Install:
#   helm upgrade --install kafka oci://registry-1.docker.io/bitnamicharts/kafka \
#     -n <your-namespace> -f starter/helm/kafka-values.yaml

controller:
  replicaCount: 1
  # Persistence lives under controller (KRaft chart) — a top-level `persistence:` block is silently ignored.
  # Small volume so topics survive pod restarts without using up your project's disk quota.
  persistence:
    enabled: true
    size: 2Gi

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
