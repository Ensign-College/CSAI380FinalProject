# Values for the Bitnami Kafka Helm chart (oci://registry-1.docker.io/bitnamicharts/kafka).
# ⚠️ Teaching configuration: single replica, PLAINTEXT listeners, no auth.
# Never run Kafka like this in production.
# Install:
#   helm upgrade --install kafka oci://registry-1.docker.io/bitnamicharts/kafka \
#     -n <your-namespace> -f starter/helm/kafka-values.yaml

# Bitnami removed legacy tags from docker.io/bitnami in 2025; pull from bitnamilegacy instead
global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/kafka

controller:
  replicaCount: 1
  # Persistence lives under controller (KRaft chart) — a top-level `persistence:` block is silently ignored.
  # Small volume so topics survive pod restarts without using up your project's disk quota.
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

# Single broker: internal topics must use replication factor 1 or consumer groups never form
overrideConfiguration:
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
