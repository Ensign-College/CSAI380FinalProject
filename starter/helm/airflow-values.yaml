# Values for the official Apache Airflow Helm chart (apache-airflow/airflow), Airflow 3.
# Install:
#   helm repo add apache-airflow https://airflow.apache.org
#   helm upgrade --install airflow apache-airflow/airflow \
#     -n <your-namespace> -f starter/helm/airflow-values.yaml

executor: LocalExecutor

# Run migrations as a regular Job, not a Helm hook — with hooks + `helm --wait` the
# migrations never run and every component crash-loops waiting for them
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Keep the footprint small for a shared teaching cluster
workers:
  replicas: 1

# Disk quota on the shared cluster is tight (SSD_TOTAL_GB); logs stay on
# emptyDir instead of persistent SSD volumes.
logs:
  persistence:
    enabled: false
triggerer:
  enabled: false # no deferrable operators in this project — saves a whole pod of CPU/memory quota
  persistence:
    enabled: false

# Small requests — a handful of course DAGs; chart defaults strand pods Pending on full sandbox nodes.
# Sidecars must be sized explicitly: GKE Autopilot defaults unspecified containers to 500m/2Gi.
dagProcessor:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

scheduler:
  # LocalExecutor runs tasks inside the scheduler — give it a bit more than the rest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

apiServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

statsd:
  enabled: false # not needed for the project; saves sandbox quota

# Shrink the metadata DB volume (chart default is 8Gi) — shared disk quota
postgresql:
  primary:
    persistence:
      size: 2Gi

webserverSecretKeySecretName: airflow-webserver-secret   # create with kubectl, see 3.5 instructions

dags:
  gitSync:
    enabled: true
    # TODO(student): point gitSync at YOUR assignment repository so Airflow
    # loads the DAG in dags/etl_pipeline.py
    repo: https://github.com/<your-github-user>/<your-assignment-repo>.git
    branch: main
    subPath: dags
    period: 60s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# Extra pip packages the ETL DAG needs
extraPipPackages:
  - apache-airflow-providers-google
  - apache-airflow-providers-mysql
